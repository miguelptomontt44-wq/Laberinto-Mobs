# ===== LaberintoMobs 1.4.1 =====
# La zona se configura con /laberinto pos1 y /laberinto pos2 (o editando estos numeros).
# Despues: /laberinto reload
zona:
  activa: false
  mundo: world
  min:
    x: 0
    y: 0
    z: 0
  max:
    x: 0
    y: 0
    z: 0

# Protege el laberinto del fuego (bolas de fuego de Blaze, rayos, flechas incendiarias)
proteccion:
  fuego: true

spawn:
  intervalo-ticks: 30      # cada cuanto intenta spawnear (20 ticks = 1 segundo)
  por-ciclo: 4             # (valor base; cada dificultad define el suyo)
  max-total: 60            # (valor base)
  max-por-jugador: 30      # (valor base)
  distancia-min: 8         # minimo de bloques al jugador
  distancia-max: 28        # maximo de bloques al jugador
  borrar-tras-segundos: 10 # segundos sin jugadores antes de borrar los mobs

# Valores base: se usan si dificultad.activa = false
efectos:
  fuerza: 1
  velocidad: 1
mobs:
  pesos:
    HUSK: 10
    SKELETON: 8
    PILLAGER: 10
    PIGLIN: 12
    HOGLIN: 8
    PIGLIN_BRUTE: 25
    EVOKER: 20
    WITHER_SKELETON: 25
    ENDERMAN: 20
    RAVAGER: 8
    VINDICATOR: 22
    BOGGED: 12
    STRAY: 10
    WITCH: 10
    ZOGLIN: 12
    BLAZE: 10
    BREEZE: 8
    ILLUSIONER: 5

# ===================================================================
#  DIFICULTAD  (cambia mobs, botin y recompensas)
# ===================================================================
# Cada X minutos el laberinto cambia de nivel y se AVISA A TODO EL SERVER
# (chat + titulo + sonido). Los jugadores dentro ven una barra con el nivel.
# Comandos (admin):  /laberinto dificultad <facil|medio|dificil|rotar|pausar|reanudar>
# Cualquiera puede ver el nivel actual con:  /nivel
dificultad:
  activa: true
  cambiar-cada-minutos: 30
  modo: ALEATORIO              # ALEATORIO (siempre distinta a la actual) o CICLO (facil>medio>dificil)
  pesos-aleatorio: {FACIL: 35, MEDIO: 40, DIFICIL: 25}
  inicial: MEDIO
  aviso-previo-segundos: 60    # avisa a los del laberinto antes del cambio (0 = no)
  limpiar-mobs-al-cambiar: true
  barra: true                  # barra de jefe con el nivel y el tiempo
  resetear-portales: true      # al cambiar de nivel reinicia los portales de salida (necesita LaberintoPortales)

  niveles:
    FACIL:
      nombre: Facil
      descripcion: "Mobs mas debiles y botin comun. Ideal para entrar con calma."
      spawn: {max-total: 30, max-por-jugador: 15, por-ciclo: 2}
      efectos: {fuerza: 0, velocidad: 0}
      vida-multiplicador: 1.0
      mobs: {HUSK: 18, ZOMBIE: 16, SKELETON: 14, SPIDER: 12, CAVE_SPIDER: 8, SILVERFISH: 8, PILLAGER: 10, VINDICATOR: 16, BOGGED: 14, STRAY: 12, WITCH: 8, PIGLIN_BRUTE: 8, ENDERMAN: 6, WITHER_SKELETON: 4}
      loot:
        cantidad: 7
        tiradas-min: 1
        tiradas-max: 1
        rareza: {COMUN: 1.6, RARO: 0.7, EPICO: 0.25, LEGENDARIO: 0.1}
      recompensa-mobs: {xp-multiplicador: 1.0, drop-chance: 0.02, drop-rareza-maxima: RARO}
    MEDIO:
      nombre: Medio
      descripcion: "El laberinto de siempre: mobs fuertes y botin equilibrado."
      spawn: {max-total: 60, max-por-jugador: 30, por-ciclo: 4}
      efectos: {fuerza: 1, velocidad: 1}
      vida-multiplicador: 1.0
      mobs: {PIGLIN_BRUTE: 25, EVOKER: 20, WITHER_SKELETON: 25, ENDERMAN: 20, RAVAGER: 8, VINDICATOR: 22, BOGGED: 12, STRAY: 10, WITCH: 10, ZOGLIN: 12, BLAZE: 10, BREEZE: 8, ILLUSIONER: 5, PIGLIN: 12, HOGLIN: 8, HUSK: 10, SKELETON: 8, CAVE_SPIDER: 8, PILLAGER: 10, VEX: 4}
      loot:
        cantidad: 10
        tiradas-min: 1
        tiradas-max: 2
        rareza: {COMUN: 1.0, RARO: 1.0, EPICO: 1.0, LEGENDARIO: 1.4}
      recompensa-mobs: {xp-multiplicador: 1.5, drop-chance: 0.05, drop-rareza-maxima: RARO}
    DIFICIL:
      nombre: Dificil
      descripcion: "PELIGRO: mobs letales, mas cantidad y vida... pero el mejor botin."
      spawn: {max-total: 80, max-por-jugador: 40, por-ciclo: 5}
      efectos: {fuerza: 2, velocidad: 1}
      vida-multiplicador: 1.4
      mobs: {PIGLIN_BRUTE: 24, EVOKER: 24, WITHER_SKELETON: 28, ENDERMAN: 18, RAVAGER: 16, VINDICATOR: 14, BOGGED: 6, STRAY: 4, WITCH: 10, ZOGLIN: 18, BLAZE: 16, BREEZE: 14, ILLUSIONER: 12, HOGLIN: 12, VEX: 8, DROWNED: 8, PIGLIN: 8, PILLAGER: 6}
      loot:
        cantidad: 14
        tiradas-min: 1
        tiradas-max: 3
        rareza: {COMUN: 0.5, RARO: 1.1, EPICO: 2.0, LEGENDARIO: 4.5}
      recompensa-mobs: {xp-multiplicador: 2.5, drop-chance: 0.10, drop-rareza-maxima: EPICO}

# ===================================================================
#  HABILIDADES UNICAS (armas y armaduras del laberinto)
# ===================================================================
# Los items con "habilidad:" en el loot tienen poderes especiales.
habilidades:
  activo: true
  pvp: true             # si los efectos tambien funcionan contra jugadores
  set-completo: true    # bonus al llevar casco+peto+pantalones+botas del laberinto

# ===================================================================
#  BOTIN (LOOT) DEL LABERINTO
# ===================================================================
# Cada cierto tiempo TODO el botin desaparece y aparece en otros lugares.
# Click (izq. o der.) sobre el cofre/cabeza para recibir el premio.
# Brillo: gris=comun, celeste=raro, morado=epico, dorado=legendario.
loot:
  activo: true
  cantidad: 10              # (valor base; cada dificultad define el suyo)
  tiradas-min: 1            # (valor base)
  tiradas-max: 2            # (valor base)
  regenerar-minutos: 10     # cada cuanto cambian de lugar y se renuevan
  apariencia: COFRE         # COFRE o CABEZA
  separacion-minima: 6
  paredes-minimas: 1        # paredes pegadas al cofre (evita que salgan sobre los muros)
  distancia-visible: 48
  avisar-regeneracion: true
  anunciar-legendarios: true

  # peso = probabilidad relativa (mas alto = mas comun). Acepta decimales.
  # La probabilidad final depende del nivel: peso x multiplicador de rareza del nivel.
  # Ver porcentajes reales:  /laberinto loot chances [facil|medio|dificil]
  # Campos extra opcionales por item:
  #   habilidad: id de habilidad unica      pocion: tipo de pocion (strong_healing...)
  #   niveles: {FACIL: 0, DIFICIL: 2}      multiplicador propio por nivel (0 = no sale)
